<!DOCTYPE html>
<html lang="en">
<head>
    <title>Secure Production Login</title>
</head>
<body>
    <form id="loginForm">
        <!-- Added autocomplete attributes to fix the Chrome warning -->
        <input type="email" id="email" placeholder="Email" autocomplete="username" required>
        <input type="password" id="pass" placeholder="Password" autocomplete="current-password" required>
        
        <!-- Removed onclick, went back to a standard button with an ID -->
        <button type="button" id="loginBtn">Log In</button>
    </form>

    <br><br>
    <button id="dashboardBtn">View Secure Dashboard</button>

    <script>
        // We attach the click event via JavaScript, which Helmet prefers!
        document.getElementById('loginBtn').addEventListener('click', async (e) => {
            e.preventDefault(); // Stops any refreshing

            const email = document.getElementById('email').value;
            const password = document.getElementById('pass').value;

            if (!email || !password) {
                alert("Please enter both email and password");
                return;
            }

            try {
                // 1. Get the CSRF token
                const csrfRes = await fetch('http://localhost:3000/api/csrf-token');
                const csrfData = await csrfRes.json();
                const secretCsrfToken = csrfData.csrfToken;

                // 2. Send the login request
                const loginRes = await fetch('http://localhost:3000/auth/login', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'CSRF-Token': secretCsrfToken 
                    },
                    body: JSON.stringify({ email, password })
                });

                if (loginRes.ok) {
                    alert("Logged in successfully! The secure cookie is set.");
                } else {
                    alert("Invalid credentials");
                }
            } catch (err) {
                console.error(err);
                alert("Cannot connect to server. Check your terminal!");
            }
        });

        // Dashboard logic
        document.getElementById('dashboardBtn').addEventListener('click', async () => {
            try {
                const response = await fetch('http://localhost:3000/api/dashboard');
                
                if (response.ok) {
                    const data = await response.json();
                    alert("Success: " + data.message);
                } else {
                    alert("Access Denied: You are not logged in!");
                }
            } catch (err) {
                alert("Server connection failed.");
            }
        });
    </script>
</body>
</html>
