<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard</title>
    
    <link rel="stylesheet" href="toast.css">
    <script src="toast.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: lightgray;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            height: 100vh;
            margin: 0;
        }

        .wrapper {
            display: flex; 
            width: 100%;  
            height: 100vh;
        }

        .manager-form-panel {
            flex: 1;
            border-right: 2px solid #e2e8f0;
            background-color: white;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .manager-form-panel h1 {
            color: darkblue;   
            margin: 0 0 5px 0;
            font-size: 30px;
        }

        .manager-form-panel h2 {
            color: darkblue;
            margin: 0 0 10px 0;
            font-size: 20px;
        }

        .manager-form-panel h3 {
            color: darkgreen;
            margin: 0 0 10px 0;
            font-size: 18px;
        }

        .manager-form-panel label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            font-size: 15px;
        }

        .manager-form-panel input,
        .manager-form-panel select {
            width: 100%;
            padding: 10px;
            margin: 6px 0 6px 0;
            border-radius: 5px;
            border: 2px solid #e2e8f0;
        }

        .form-container {
            padding: 30px; 
            background-color: #f8fafc; 
            border: 2px solid #e2e8f0; 
            border-radius: 8px;
        }

        .add-btn {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .add-btn:hover {
            background-color: #0056b3;
            transition: all 0.5s ease;

        }

        .logout-btn {
            align-self: flex-start;
            background: red;
            color: white;
            font-weight: bold;
            margin-top: 20px;
            border: none;
            padding:5px 8px; 
            border-radius:3px;
            cursor:pointer;
        }

        .logout-btn:hover {
            background: #813030;  
            transition: all 0.5s ease;

        }

        .manager-table-panel {
            flex: 2;
            padding: 30px;
            background-color: white;
            display: flex;
            flex-direction: column;
        }

        .manager-table-panel h1 {
            color: darkblue;
            margin: 0 0 15px 0;
        }

        .table-container {
            overflow-y: auto;
            flex: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border: 2px solid black;
            font-size: 15px;
        }

        th {
            background-color: gainsboro;
        }
        
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="manager-form-panel"> 
            <div class="form-container">
                <h1>Manager Dashboard</h1>
                <h2 id="welcomeText">Welcome, Manager!</h2>

                <div style="background-color: white; border: 2px solid #e2e8f0; border-radius: 6px; padding: 10px; margin-bottom: 10px;">
                    <span style="font-size: 14px; font-weight: bold; color: #49586c;">Assigned Interns:</span>
                    <span id="assignedCount" style="font-size: 14px; font-weight: bold; color: #1e3a8a; margin-left: 6px;">0</span>
                </div>

                <h3>Assign Task</h3>
                <form id="taskForm" onsubmit="event.preventDefault(); assignTask();">
    
                    <label for="selectIntern">Select Intern:</label>
                    <select id="selectIntern" required></select>
    
                    <label for="taskTitle">Task Assigned:</label>
                    <textarea id="taskTitle" placeholder="e.g., Intern Management System" style="width: 100%; height: 180px; padding: 5px; margin-top:10px;" required></textarea>

                    <button type="submit" class="add-btn">Assign Task</button>

                </form>
            </div>
            
            <button type="button" class="logout-btn" onclick="logout();">Logout</button>
        </div>

        <div class="manager-table-panel">
            <h1>My Assigned Interns</h1>
                      
            <div style="margin-bottom: 12px;">
                <input type="text" id="tableSearch" placeholder="Search by name, email, or task" onkeyup="filterTable()"
                style="width: 100%; padding: 8px 12px; border: 1px solid grey; border-radius: 4px; font-size: 14px;">
            </div>
            
            <div class="table-container">
                <table id="intern-table">

                </table> 
            </div>
        </div>
    </div>

<script>
// 1. Route Guard
    // a. Read 'token' and 'currentUser' from localStorage
    // b. If missing, or role is not 'manager', alert and redirect to login.html

const token = localStorage.getItem('token');
const user = JSON.parse(localStorage.getItem('currentUser'));

if (!token || !user || user.role !== 'manager') {
    alert('Access Denied! Please log in first.');
    window.location.href = 'login.html';
}

const authHeaders = {
    'Content-Type': 'application/json',
    'Authorization': `Bearer ${token}`
};

document.getElementById('welcomeText').textContent = `Welcome, ${user.exactRole}!`;

// 2. Create a reusable authHeaders object containing 'Content-Type' and 'Authorization: Bearer <token>'

// 3. Set the welcomeText element to greet the specific manager role (from currentUser)

// 4. Create a logout() function (clear localStorage, redirect to login)

function logout() {
    localStorage.removeItem('currentUser');
    localStorage.removeItem('token');
    window.location.href = 'login.html';
}

// 5. Create an async loadData() function
    // a. Fetch interns from '/api/interns' using authHeaders
    // b. Handle 401/403 status codes by calling logout()
    // c. Filter the returned interns to only include those assigned to this specific manager
    // d. Update the 'assignedCount' DOM element

async function loadData() {
    const res = await fetch('http://localhost:3000/api/interns', { headers: authHeaders });
    if (res.status === 401 || res.status === 403) return logout();
    
    const interns = await res.json();
    const assignedInterns = interns.filter(i => i.manager.trim().toLowerCase() === user.selectedRole.trim().toLowerCase());
    
    document.getElementById('assignedCount').innerText = assignedInterns.length;

    const select = document.getElementById('selectIntern');
    select.innerHTML = "<option value=''>--- Select Intern ---</option>";
    assignedInterns.forEach(intern => {
        const option = document.createElement('option');
        option.value = intern.email;
        option.textContent = `${intern.name} (${intern.role})`;
        select.appendChild(option);
    });

    const table = document.getElementById('intern-table');
    table.innerHTML = `<tr><th>Intern</th><th>Task Assigned</th><th>Status</th><th>Score</th><th>Feedback</th><th>Action</th></tr>`;

    let hasTask = false;
    assignedInterns.forEach(intern => {
        intern.tasks.forEach(task => {
            hasTask = true;
            const row = table.insertRow();
            row.insertCell(0).textContent = intern.name;
            
            row.insertCell(1).innerHTML = `
                <textarea id='task_title_${task.id}' style="width:100%;height:100px;padding:5px;">${task.title}</textarea>
                <small style="color:grey;display:block;margin-top:5px;">Assigned: ${task.assignedDate}</small>
            `;
            
            const statusCell = row.insertCell(2);
            statusCell.innerHTML = `
                <select onchange="updateStatus(${task.id}, this.value);" style="padding: 4px;">
                    <option value="Pending" ${task.status === 'Pending' ? 'selected' : ''}>Pending</option>
                    <option value="In Progress" ${task.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                    <option value="Completed" ${task.status === 'Completed' ? 'selected' : ''}>Completed</option>
                </select>
            `;
            const sel = statusCell.querySelector('select');
            sel.style.borderLeft = task.status === 'Pending' ? '10px solid #ff4d4d' : (task.status === 'In Progress' ? '10px solid #e6ca18' : '10px solid #28a745');
            
            row.insertCell(3).innerHTML = `
                <input type="number" id="score_${task.id}" min="0" max="100" style="width:44px;padding:3px;text-align:center;" placeholder="0" value="${task.score !== '-' ? task.score : ''}">
                <span style="font-size: 12px; font-weight: bold;">/ 100</span>
            `;
            
            row.insertCell(4).innerHTML = `<textarea id="fb_${task.id}" style="width:100%;height:100px;padding:5px;">${task.feedback}</textarea>`;
            
            row.insertCell(5).innerHTML = `
                <button style="background:green;color:white;border:none;padding:5px 8px;cursor:pointer;" onclick="saveScoreAndFeedback(${task.id})">Save</button>
                <button type="button" style="background:red;color:white;border:none;padding:5px 8px;cursor:pointer;margin-top:4px;" onclick="deleteTask(${task.id})">Delete</button>
            `;
        });
    });

    if (!hasTask) table.insertRow().innerHTML = "<td colspan=6>No tasks assigned yet.</td>";
}
    
    // e. Populate the 'selectIntern' dropdown with the filtered interns
    
    // f. Select the task table and reset its innerHTML to show headers
    // g. Loop through the filtered interns, and then loop through their tasks
        // h. Create rows and insert cells for Intern Name, Task Title (as a textarea), Status (as a dropdown), Score (as an input), Feedback (textarea), and Actions (Save/Delete buttons)
        // i. Apply colored left-borders to the status dropdown based on its current value
    // j. If no tasks exist across all assigned interns, insert a "No tasks" row

// 6. Create an async assignTask() function
    // a. Read the intern email and task title from the DOM
    // b. Fetch POST to '/api/tasks' with authHeaders and data
    // c. Show a success toast, reset the form, and call loadData()

async function assignTask() {
    const internEmail = document.getElementById('selectIntern').value;
    const title = document.getElementById('taskTitle').value.trim();
    if (!internEmail) return;

    await fetch('http://localhost:3000/api/tasks', {
        method: 'POST',
        headers: authHeaders,
        body: JSON.stringify({ internEmail, title })
    });

    showToast("Task assigned successfully!", "success");
    document.getElementById('taskForm').reset();
    loadData();
}

// 7. Create an async saveScoreAndFeedback(taskId) function
    // a. Read the score, feedback, and title from their respective DOM elements using the taskId
    // b. Validate that the score is a number between 0 and 100
    // c. Fetch PUT to `/api/tasks/${taskId}/score` with authHeaders and data
    // d. Show a success toast and call loadData()

async function saveScoreAndFeedback(taskId) {
    const score = document.getElementById(`score_${taskId}`).value.trim();
    const feedback = document.getElementById(`fb_${taskId}`).value.trim();
    const title = document.getElementById(`task_title_${taskId}`).value.trim();

    if (score !== '' && (isNaN(Number(score)) || Number(score) < 0 || Number(score) > 100)) {
        return showToast("Please enter a valid score (0-100).", "error");
    }

    await fetch(`http://localhost:3000/api/tasks/${taskId}/score`, {
        method: 'PUT',
        headers: authHeaders,
        body: JSON.stringify({ title, score, feedback })
    });
    
    showToast("Score saved successfully!");
    loadData();
}

// 8. Create an async updateStatus(taskId, newStatus) function
    // a. Fetch PUT to `/api/tasks/${taskId}/status` with authHeaders and the new status
    // b. Show a success toast and call loadData()

async function updateStatus(taskId, newStatus) {
    await fetch(`http://localhost:3000/api/tasks/${taskId}/status`, {
        method: 'PUT',
        headers: authHeaders,
        body: JSON.stringify({ status: newStatus })
    });
    showToast(`Status updated to ${newStatus}.`);
    loadData();
}

// 9. Create an async deleteTask(taskId) function
    // a. Prompt for confirmation
    // b. Fetch DELETE to `/api/tasks/${taskId}` with authHeaders
    // c. Show a success toast and call loadData()

async function deleteTask(taskId) {
    if (!confirm('Are you sure you want to delete this task?')) return;
    
    await fetch(`http://localhost:3000/api/tasks/${taskId}`, { 
        method: 'DELETE',
        headers: authHeaders 
    });
    showToast("Task deleted successfully!", "success"); 
    loadData();
}

// 10. Create filterTable() for live search (keep your existing logic)

function filterTable() {
    const search = document.getElementById('tableSearch').value.toLowerCase();
    const rows = document.getElementById('intern-table').getElementsByTagName('tr');
    for (let i = 1; i < rows.length; i++) {
        rows[i].style.display = rows[i].textContent.toLowerCase().includes(search) ? '' : 'none';
    }
}

window.onload = loadData;

// 11. Assign loadData to window.onload
</script>

</body>
</html>
