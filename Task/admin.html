<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    
    <link rel="stylesheet" href="toast.css">
    <script src="toast.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            
        }

        body {
            font-family: Arial, sans-serif;
            background-color: lightgray;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; 
        }

        .wrapper {
            display: flex; 
            width: 100%;  
            height: 100vh;
        }

        .admin-dashboard {
            flex: 1;
            border-right: 2px solid #e2e8f0;
            background-color: white;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .admin-dashboard h1 {
            color: darkblue;   
            margin: 0 0 5px 0;
            font-size: 30px;
        }

        .admin-dashboard h2 {
            color: darkblue;
            margin: 0 0 20px 0;
            font-size: 20px;
        }

        .admin-dashboard h3 {
            color: darkgreen;
            margin: 0 0 15px 0;
            font-size: 18px;
        }

        .admin-dashboard label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            font-size: 15px;
        }

        .admin-dashboard input,
        .admin-dashboard select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 12px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .form-container {
            height: 100%;
            padding: 30px; 
            background-color: #f8fafc; 
            border: 2px solid #e2e8f0; 
            border-radius: 8px;
        }

        .add-btn {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .add-btn:hover {
            background-color: #0056b3;
            transition: all 0.5s ease;

        }

        .export-btn {
            background-color: #078960;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .export-btn:hover {
            background-color: #047857;
        }

        .logout-btn {
            align-self: flex-start;
            background: red;
            color: white;
            font-weight: bold;
            margin-top: 20px;
            border: none;
            padding:5px 8px; 
            border-radius:3px;
            cursor:pointer;
        }

        .logout-btn:hover {
            background: #c74040;   
            transition: all 0.5s ease;

        }
        
        .intern-list {
            flex: 2;
            padding: 30px;
            background-color: white;
            display: flex;
            flex-direction: column;
        }

        .intern-list h1 {
            color: darkblue;
            margin: 0;
        }

        .table-container {
            overflow-y:auto;
            flex: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 10px 12px;
            text-align: left;
            border: 2px solid black;
            font-size: 15px;
        }

        th {
            background-color: gainsboro;
        }

        .delete-btn {
            background-color: red;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover {
            background-color: #b91c1c;
            transition: all 0.5s ease;

        }

        .ov-box {
            display: flex;
            margin-bottom: 20px;
            gap: 15px;
        }
        
        .interns-info {
            flex: 1;
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .box {
            font-size: 13px;
            font-weight: bold;
            color: #6a7990;
        }

        .box-value {
            font-size: 24px;
            font-weight: bold;
            color: #1e3a8a; 
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="admin-dashboard">
            <div class="form-container">
                <h1>Admin Dashboard</h1>
                <h2>Welcome, HR Admin!</h2>
                
                <h3>Add New Intern</h3>

                <form id="addIntern" onsubmit="event.preventDefault(); addIntern();">
                    <label for="internName">Full Name:</label>
                    <input type="text" id="internName" name="internName" required>

                    <label for="internEmail">Email:</label>
                    <input type="email" id="internEmail" name="internEmail" required>

                    <label for="internRole">Role:</label>
                    <select id="internRole" name="internRole" required>
                        <option value="">Select Role</option>
                        <option value="Full Stack - Intern">Full Stack - Intern</option>
                        <option value="Android - Intern">Android - Intern</option>
                    </select>

                    <label for="manager">Assign to Manager:</label>
                    <select id="manager" name="manager" required>
                        <option value="">Select Manager</option>
                        <option value="Manager 1">Manager 1</option>
                        <option value="Manager 2">Manager 2</option>
                    </select>

                    <button type="submit" class="add-btn">Add Intern</button>
                </form>
            </div>
            
            <button type="button" class="logout-btn" onclick="logout();">Logout</button>
        </div>

        <div class="intern-list">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h1>Intern List</h1>
                <button type="button" class="export-btn" onclick="exportToCSV();">Export CSV</button>
            </div>


            <div class="ov-box">
                <div class="interns-info">
                    <span class="box">Total Interns:</span>
                    <span class="box-value" id="totalInternsVal">0</span>
                </div>

                <div class="interns-info">
                    <span class="box">Total Task Assigned:</span>
                    <span class="box-value" id="totalTasksVal">0</span>                
                </div>

                <div class="interns-info">
                    <span class="box">Average Performance:</span>
                    <span class="box-value" id="overallAvgVal">-</span>
                </div>
            </div>

            <div style="margin-bottom: 15px;">
                <input type="text" id="adminSearch" placeholder="Search interns by name, email, or role..." 
                onkeyup="filterAdminTable();" style="width: 100%; padding: 9px 14px; 
                border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
            </div>            
     
            <div class="table-container">
                <table id="intern-table">

                </table>
            </div>
        </div>
    </div>
    
    <script>
    // =========================================================================
    // 1. ROUTE GUARD & LOGOUT
    // =========================================================================

    // 1. Check if 'isAdmin' is NOT equal to 'true' in localStorage

    if (localStorage.getItem('isAdmin')!=='true'){
        alert('Please log in as Admin first!');
        window.location.href='login.html';
    }
    // 2. Alert 'Please log in as Admin first!' and redirect to 'login.html'

    // 3. Define the 'logout' function: remove 'isAdmin' from localStorage and redirect to 'login.html'

    function logout() {
        localStorage.removeItem('isAdmin');
        window.location.href='login.html';
    }
    // =========================================================================
    // 2. ADD INTERN FUNCTION
    // =========================================================================

    // 4. Create function named 'addIntern'

    function addIntern() {
        const name=document.getElementById('internName').value.trim();
        const email=document.getElementById('internEmail').value.trim();
        const role=document.getElementById('internRole').value.trim();
        const manager=document.getElementById('manager').value.trim();
        const interns=JSON.parse(localStorage.getItem('interns')) || []; 

        if(interns.some(i=> i.email.toLowerCase()===email.toLowerCase())){
            showToast("An intern with this email already exists!");
            return;
        }

        // 5. Read and trim 'internName' input value

        // 6. Read and trim 'internEmail' input value

        // 7. Read selected value from 'internRole' dropdown

        // 8. Read selected value from 'manager' dropdown

        // 9. Get and parse 'interns' array from localStorage (fallback to empty array [])

        // 10. Check if any existing intern already has this email (case-insensitive)

        // 11. If duplicate exists: show error toast "An intern with this email already exists!" and stop (return)  
    
        const joinDate=new Date().toLocaleDateString('en-GB');
    
        // 12. Create today's date formatted as 'en-GB' (DD/MM/YYYY) into 'joinDate'

        interns.push({
            name, email, role, joinDate, manager, tasks: [] 
        })
        localStorage.setItem('interns', JSON.stringify(interns));
        showToast(`Intern ${name} added successfully!`, 'success')
        const form=document.getElementById('addIntern');

        form.reset();
        showIntern();

        // 13. Push new intern object { name, email, role, joinDate, manager, tasks: [] } into interns array

        // 14. Save updated array back into localStorage as a JSON string

        // 15. Reset the form with ID 'addIntern'

        // 16. Refresh the table by calling showIntern()

        // 17. Show success toast: `Intern ${name} added successfully!`

    }
    // =========================================================================
    // 3. RENDER TABLE & SUMMARY CARDS
    // =========================================================================

    // 18. Create function named 'showIntern'
    function showIntern() {

        const interns=JSON.parse(localStorage.getItem('interns'))||[];
        const table=document.getElementById('intern-table');
     
        table.innerHTML=`

        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Manager</th>
        <th>Average Task Points</th>
        <th>Action</th>
        `;

        if(interns.length===0){
            table.innerHTML=`<td colspan=6> No interns yet.</td>`;
            return;
        }

        // 19. Get and parse 'interns' array from localStorage (fallback to [])

        // 20. Grab the table element with ID 'intern-table'

        // 21. Set table.innerHTML with 6 headers: Name, Email, Role, Manager, Average Task Score, Action

        // 22. If interns array is empty, insert a row with a centered message spanning all 6 columns, and return

        interns.forEach(intern => {

            const row=table.insertRow();
            row.insertCell(0).textContent=intern.name;
            row.insertCell(1).textContent=intern.email;
            row.insertCell(2).textContent=intern.role;
            row.insertCell(3).textContent=intern.manager;

            const returnVal=calculateTaskAvg(intern);
            let a=row.insertCell(4)
            a.textContent=returnVal;

            if (returnVal!=='-'){
                const val=parseFloat(returnVal);

                if (val>=80){
                    a.style.color='green';
                }
                else if (val<80 && val>=50){
                    a.style.color='orange';
                }

                else {
                    a.style.color='red';
                }
            }
            row.insertCell(5).innerHTML=`<button class='delete-btn' onclick="deleteIntern('${intern.email}');">Delete</button>`
        });

        // 23. Loop through each intern to build table rows:

        // 24. Insert a new row (table.insertRow())

        // 25. Cell 0: set textContent to intern.name

        // 26. Cell 1: set textContent to intern.email

        // 27. Cell 2: set textContent to intern.role

        // 28. Cell 3: set textContent to intern.manager

        // 29. Cell 4: calculate average using calculateTaskAvg(intern), and set as textContent

        // 30. Extract the number from that average string using parseFloat()

        // 31. If the average string is NOT equal to '-':

        // 32. Color text red if score < 50, green if >= 80, otherwise orange
                
        // 33. Cell 5: set innerHTML to a delete button calling deleteIntern with the intern's email

        // -------------------------------------------------------------
        // SUMMARY CARDS CALCULATION (Below the table loop)
        // -------------------------------------------------------------

        let totalTaskCount=0;
        let allGradedScores=[];
        interns.forEach(intern=>{
            (intern.tasks||[]).forEach(task=>{            
                totalTaskCount++;
                if (typeof task.score==="number"){
                    allGradedScores.push(task.score);        
                }
            });
        });

        // 34. Initialize totalTaskCount to 0, and allGradedScores array to []

        // 35. Loop through all interns and their tasks:

        // 36. Increment totalTaskCount for every task
            
        // 37. If task.score is a number (typeof === 'number'), push it into allGradedScores

        document.getElementById('totalInternsVal').textContent=interns.length;
        document.getElementById('totalTasksVal').textContent=totalTaskCount;

        if (allGradedScores.length>=1){
            const sum=allGradedScores.reduce((sum,i)=> sum+i,0);
            const avg=(sum/allGradedScores.length).toFixed(1);
            document.getElementById('overallAvgVal').textContent=`${avg} / 100`;
        }

        else {
            document.getElementById('overallAvgVal').textContent='-';
        }
        
        // 38. Update 'totalInternsVal' element with interns.length

        // 39. Update 'totalTasksVal' element with totalTaskCount

        // 40. If allGradedScores has at least one score:

        // 41. Sum all scores using reduce(), calculate average to 1 decimal place, and display as `${avg} / 100` in 'overallAvgVal'
        
        // 42. Otherwise (no scores exist): set 'overallAvgVal' textContent to '-'

    }
    // =========================================================================
    // 4. CALCULATE TASK AVERAGE FOR ONE INTERN
    // =========================================================================
    
    // 43. Create function 'calculateTaskAvg' taking an 'intern' object

    function calculateTaskAvg(intern) {
        const tasks=intern.tasks || [];
        const graded=tasks.filter(task=> task.score !=='-' && typeof task.score=='number').map(task => Number(task.score));

        if (graded.length===0){
            return '-';
        }

        const sum=graded.reduce((sum,i)=> sum+i,0);
        const avg=(sum/graded.length).toFixed(1);

        return `${avg} / 100`;

        // 44. Get tasks array from intern (fallback to [])

        // 45. Filter graded tasks: score is not '-', not empty, and is a valid number; map them to numbers

        // 46. If graded array has 0 items, return '-'

        // 47. Sum all graded scores using reduce()

        // 48. Return calculated average to 1 decimal place + " / 100"

    }
    // =========================================================================
    // 5. DELETE INTERN FUNCTION
    // =========================================================================

    // 49. Create function 'deleteIntern' taking 'email'

    function deleteIntern(email) {

        let interns=JSON.parse(localStorage.getItem('interns')) || [];
        let toDelete=interns.find(intern=> intern.email.toLowerCase()==email.toLowerCase());

        if(!toDelete){
            showToast("Intern no longer exists!");
            showIntern();
            return;
        }

        if (confirm(`Delete ${toDelete.name}?`)){
        
            interns=interns.filter(intern=> intern.email.toLowerCase()!==email.toLowerCase());
            localStorage.setItem('interns' , JSON.stringify(interns));
            showToast(`Intern ${toDelete.name} deleted successfully!`, 'success');
            showIntern()    
        }

        // 50. Get and parse 'interns' array from localStorage

        // 51. Find the intern matching this email (case-insensitive)

        // 52. If intern not found: show error toast "Intern no longer exists!", call showIntern(), and return

        // 53. Ask for confirmation: confirm(`Delete ${target.name}?`)

        // 54. If confirmed: filter out the intern whose email matches (case-insensitive)

        // 55. Save updated array to localStorage as JSON string

        // 56. Refresh the table by calling showIntern()        
    }

    // =========================================================================

    // 6. LIVE TABLE SEARCH (ADMIN)

    // =========================================================================

    // 57. Create function 'filterAdminTable'

    function filterAdminTable() {

        const searchVal=document.getElementById('adminSearch').value.toLowerCase();
        const table=document.getElementById('intern-table');
        const row=table.getElementsByTagName('tr');

        for (let i=1;i<row.length; i++){
         
            const rowText= row[i].textContent.toLowerCase();
            if (rowText.includes(searchVal)){
                row[i].style.display='';
            }
            else{
                row[i].style.display='none';
            }
        }
    }
    // 58. Read and lowercase the search input value from 'adminSearch'

    // 59. Grab 'intern-table' and all its 'tr' elements

    // 60. Loop through rows starting at index 1 (skipping header at 0):
    
    // 61. If row textContent contains the query, display row (""), otherwise hide it ("none")
        
    // =========================================================================
    // 7. EXPORT TO CSV & INITIAL LOAD
    // =========================================================================

    // 62. Create function 'exportToCSV'

    function exportToCSV() {
        const interns=JSON.parse(localStorage.getItem('interns'))|| [];
        if (interns.length===0){
            showToast("No data to export!",'error');
            return;
        }

        let csv= "Intern Name,Email,Role,Manager,Task Assigned,Status,Score,Average Score\n";

        interns.forEach(intern=>{
            const avg = calculateTaskAvg(intern);
            const tasks = intern.tasks || [];

            if (tasks.length === 0){
                csv+=`"${intern.name}", "${intern.email}", "${intern.role}", "${intern.manager}", "No Task", "N/A", "N/A", "${avg}"\n`;
            }
            else{
                tasks.forEach(t => {
                    csv += `"${intern.name}","${intern.email}","${intern.role}","${intern.manager}","${t.title.replace(/"/g, '""')}","${t.status}","${t.score}","${avg}"\n`;
                });       
            }
        });


        let blob=new Blob([csv], {type:'text/csv;charset=utf-8;'});

        let url=URL.createObjectURL(blob);
        let tag=document.createElement('a');

        tag.href=url;
        tag.download='ktt_intern_tasks.csv';

        document.body.appendChild(tag);
        tag.click();
        document.body.removeChild(tag); // tag.remove();

        URL.revokeObjectURL(url);
    }

    window.onload=showIntern;
    
    // 63. Get and parse 'interns' array from localStorage

    // 64. If empty, show error toast "No data to export!" and return
    
    // 65. Initialize csv string with header columns: "Intern Name,Email,Role,Manager,Task Assigned,Status,Score,Average Score\n"
    
    // 66. Loop through each intern and their tasks:

    // 67. If intern has 0 tasks, add a row with "No tasks","N/A","N/A" and their average
    
    // 68. Otherwise, add a row for each task with title (quotes escaped), status, score, and average

    // 69. Create a Blob with the csv string and type 'text/csv;charset=utf-8;'

    // 70. Create temporary URL, create a temporary <a> tag, trigger download with filename 'ktt_intern_tasks.csv', and revoke URL

    // 71. Run showIntern when the window loads

    </script>
</body>
</html>
