<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: lightgray;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; 
        }

        .wrapper {
            display: flex; 
            width: 95%;  
            height: 95vh;
            gap: 25px;
        }

        .admin-dashboard {
            flex: 1;
            background-color: white;
            padding: 30px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .admin-dashboard h1 {
            color: darkblue;   
            margin: 0 0 5px 0;
            font-size: 30px;
        }

        .admin-dashboard h2 {
            color: darkblue;
            margin: 0 0 20px 0;
            font-size: 20px;
        }

        .admin-dashboard h3 {
            color: darkgreen;
            margin: 0 0 15px 0;
            font-size: 20px;
        }

        .admin-dashboard label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            font-size: 15px;
        }

        .admin-dashboard input,
        .admin-dashboard select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 12px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .add-btn {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .add-btn:hover {
            background-color: #0056b3;
        }

        .export-btn {
            background-color: #078960;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .export-btn:hover {
            background-color: #047857;
        }

        .logout-link {
            color: red;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
            display: inline-block;
        }

        .intern-list {
            flex: 2;
            padding: 30px;
            background-color: white;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
        }

        .intern-list h1 {
            color: darkblue;
            margin: 0;
        }

        .table-container {
            overflow-y: auto; 
            flex: 1;
        }

        table {
            width: 100%;
            height: 200px;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 10px 12px;
            text-align: left;
            border: 2px solid black;
            font-size: 15px;
        }

        th {
            background-color: gainsboro;
        }

        .delete-btn {
            background-color: red;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover {
            background-color: #b91c1c;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="admin-dashboard">
            <div>
                <h1>Admin Dashboard</h1>
                <h2>Welcome, HR Admin!</h2>

                <h3>Add New Intern</h3>

                <form id="addIntern" onsubmit="event.preventDefault(); addIntern();">
                    <label for="internName">Full Name:</label>
                    <input type="text" id="internName" name="internName" required>

                    <label for="internEmail">Email:</label>
                    <input type="email" id="internEmail" name="internEmail" required>

                    <label for="internRole">Role:</label>
                    <select id="internRole" name="internRole" required>
                        <option value="">Select Role</option>
                        <option value="Full Stack - Intern">Full Stack - Intern</option>
                        <option value="Android - Intern">Android - Intern</option>
                    </select>

                    <label for="manager">Assign to Manager:</label>
                    <select id="manager" name="manager" required>
                        <option value="">Select Manager</option>
                        <option value="Manager 1">Manager 1</option>
                        <option value="Manager 2">Manager 2</option>
                    </select>

                    <button type="submit" class="add-btn">Add Intern</button>
                </form>
            </div>
            
            <a href="#" onclick="logout();" class="logout-link">Logout</a>
        </div>

        <div class="intern-list">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h1>Intern List</h1>
                <button type="button" class="export-btn" onclick="exportToCSV();">Export CSV</button>
            </div>
            <div class="table-container">
                <table id="intern-table">

                </table>
            </div>
        </div>
    </div>
    
    <script>
        if (localStorage.getItem('isAdmin') !== 'true') {
            alert("Please log in as Admin first!");        
            window.location.href = 'login.html';
        }

        function logout() {
            localStorage.removeItem('isAdmin');
            window.location.href = 'login.html';
        }

        function addIntern(){
            const name = document.getElementById('internName').value.trim();
            const email = document.getElementById('internEmail').value.trim();
            const role = document.getElementById('internRole').value;
            const manager = document.getElementById('manager').value;

            const savedData = localStorage.getItem('interns');
            const interns = JSON.parse(savedData) || [];

            if (interns.some(i => i.email.toLowerCase() === email.toLowerCase())) {
                alert("An intern with this email already exists!");
                return;
            }

            const joinDate=new Date().toLocaleDateString('en-GB');

            interns.push({ name, email, role, joinDate, manager, tasks: [] });
            localStorage.setItem('interns', JSON.stringify(interns));

            document.getElementById('addIntern').reset();
            showIntern();
            alert(`Intern ${name} added successfully!`);
        }

        function showIntern(){
            const savedData = localStorage.getItem('interns');
            const interns = JSON.parse(savedData) || [];
            const table = document.getElementById('intern-table');

            table.innerHTML = `
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Manager</th>
                <th>Average Task Score</th>
                <th>Action</th>
            </tr>`;

            if (interns.length === 0) {
                table.insertRow().innerHTML = `<td colspan="6" style="text-align:center; padding: 20px;">No interns registered yet.</td>`;
                return;
            }

            interns.forEach(intern => {
   
                const row = table.insertRow();
                row.insertCell(0).textContent = intern.name;
                row.insertCell(1).textContent = intern.email;
                row.insertCell(2).textContent = intern.role;
                row.insertCell(3).textContent = intern.manager;

                const a=row.insertCell(4);
                const returnVal = calculateTaskAvg(intern);
                a.textContent=returnVal;

                let score=parseFloat(returnVal);

                if (returnVal!=='-'){
                    if (score<40){
                        a.style.color='red';
                    }
                    else if (score>=80){
                        a.style.color='green';
                    }
                    else{
                        a.style.color='orange'
                    }
                } 
                 
                row.insertCell(5).innerHTML = `<button class='delete-btn' onclick="deleteIntern('${intern.email}')">Delete</button>`;   
            });
        }

        function calculateTaskAvg(intern) {
            const tasks = intern.tasks || [];
            const graded = tasks
                .filter(t => t.score !== '-' && t.score !== '' && !isNaN(Number(t.score)))
                .map(t => Number(t.score));

            if (graded.length === 0) return '-';
            const total = graded.reduce((sum, val) => sum + val, 0);
            return (total / graded.length).toFixed(1) + " / 100";
        }

        function deleteIntern(email) {
            let interns = JSON.parse(localStorage.getItem('interns')) || [];
            const target = interns.find(i => i.email.toLowerCase() === email.toLowerCase());

            if (!target) {
                alert("Intern no longer exists!");
                showIntern(); 
                return;
            }

            if (confirm(`Delete ${target.name}?`)) {
                interns = interns.filter(i => i.email.toLowerCase() !== email.toLowerCase());
                localStorage.setItem('interns', JSON.stringify(interns));
                showIntern();
            }
        }

        function exportToCSV() {
            const savedData = localStorage.getItem('interns');
            const interns = JSON.parse(savedData) || [];

            if (interns.length === 0) {
                alert("No data to export!");
                return;
            }

            let csv = "Intern Name,Email,Role,Manager,Task Assigned,Status,Score,Average Score\n";

            interns.forEach(intern => {
                const avg = calculateTaskAvg(intern);
                const tasks = intern.tasks || [];

                if (tasks.length === 0) {
                    csv += `"${intern.name}","${intern.email}","${intern.role}","${intern.manager}","No tasks","N/A","N/A","${avg}"\n`;
                } else {
                    tasks.forEach(t => {
                        csv += `"${intern.name}","${intern.email}","${intern.role}","${intern.manager}","${t.title.replace(/"/g, '""')}","${t.status}","${t.score}","${avg}"\n`;
                    });
                }
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ktt_intern_tasks.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        window.onload = showIntern;
    </script>
</body>
</html>
