<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>

    <link rel="stylesheet" href="toast.css">
    <script src="toast.js"></script>

    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
            box-sizing: border-box;
        }

        body {
            background-color: lightgray;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .wrapper {
            display: flex;
            width: 95%;
            height: 90vh;
            gap: 25px;
        }

        .container {
            height: 100%;
            padding: 30px; 
            background-color: #f8fafc; 
            border: 2px solid #e2e8f0; 
            border-radius: 5px;
        }

        .intern-profile {
            flex: 1;
            background-color: white;
            border-radius: 5px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .intern-profile h1 {
            color: darkblue;
            margin: 0 0 5px 0;
            font-size: 30px;
        }

        .intern-profile h2 {
            color: darkblue;
            margin: 0 0 20px 0;
            font-size: 20px;
        }

        .info-card {
            background-color: white;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .info-label {
            font-weight: bold;
            font-size: 15px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 15px;
            font-weight: bold;
            color: darkgreen;
        }

        .logout-btn {
            align-self: flex-start;
            background: red;
            color: white;
            font-weight: bold;
            margin-top: 20px;
            border: none;
            padding:5px 8px; 
            border-radius:3px;
            cursor:pointer;
        }

        .logout-btn:hover {
            background: #c74040;        
        }

        .intern-task {
            flex: 2;
            background-color: white;
            border-radius: 5px;
            padding: 30px;
            display: flex;
            flex-direction: column;
        }

        .intern-task h1 {
            color: darkblue;
            margin: 0 0 15px 0;
            font-size: 24px;
        }

        .table-container {
            overflow-y: auto;
            flex: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border: 2px solid black;
            font-size: 15px;
        }

        th {
            background-color: gainsboro;
        }

    </style>
</head>
<body>
    <div class="wrapper">
        <div class="intern-profile">
            <div class="container">
                <h1>Student Dashboard</h1>
                <h2 id="welcomeText">Welcome!</h2>

                <div class="info-card">
                    <div class="info-label">Assigned Role</div>
                    <div class="info-value" id="roleValue">-</div>
                </div>

                <div class="info-card">
                    <div class="info-label">Assigned Manager</div>
                    <div class="info-value" id="managerValue">-</div>
                </div>

                <div class="info-card">
                    <div class="info-label">Average Performance</div>
                    <div class="info-value" id="avgRating">-</div>
                </div>
            </div>

            <button type="button" class="logout-btn" onclick="logout();">Logout</button>
        </div>

        <div class="intern-task">
            <h1>My Assigned Tasks & Scores</h1>

            <div class="table-container">
                <table id="performance-table">

                </table>
            </div>
        </div>
    </div>

    <script>
    const isStudent = localStorage.getItem('isStudent');
    
    if (!isStudent) {
        alert("Access Denied! Please log in first.");
        window.location.href='login.html';
    }

    function loadStudentData() {
        const savedData = localStorage.getItem('interns');
        const interns = JSON.parse(savedData) || [];

        const currentEmail = localStorage.getItem('currentStudentEmail') || '';
        const student = interns.find(i=>i.email.toLowerCase()===currentEmail.toLowerCase());

        if (!student) {
            alert("Student record not found!");
            logout();
            return;
        }

        document.getElementById('welcomeText').textContent = "Welcome, " + student.name + "!";
        document.getElementById('roleValue').textContent = student.role;
        document.getElementById('managerValue').textContent = student.manager;

        const tasks=student.tasks || [];

        const gradedScores = tasks
        .filter(t=>t.score !== '-' && t.score !== '' && !isNaN(Number(t.score)))
        .map(t=>Number(t.score));

        if (gradedScores.length > 0) {
            const total = gradedScores.reduce((sum, curr) => sum + Number(curr), 0);
            const avg = (total / gradedScores.length).toFixed(1);
            document.getElementById('avgRating').textContent = `${avg} / 100 (Task Completed : ${gradedScores.length} )`;
        } else {
            document.getElementById('avgRating').textContent = "-";
        }
        
        const table = document.getElementById('performance-table');

        table.innerHTML = `
        <tr>
            <th>Task Assigned</th>
            <th>Status</th>
            <th>Score</th>
            <th>Feedback</th>
       </tr>
       `;

       if (tasks.length === 0) {
        table.insertRow().innerHTML = `<td colspan="4" style="text-align:center; padding: 20px;">No tasks assigned yet.</td>`;
        return;
    }
    
    tasks.forEach(task => {
        const row = table.insertRow();
        
        row.insertCell(0).textContent = task.title;

        const statusCell = row.insertCell(1);
        statusCell.innerHTML = `
        <select onchange="updateTaskStatus(${task.id}, this.value)" style="padding: 4px 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px;">
            <option value="Pending" ${task.status === 'Pending' ? 'selected' : ''}>Pending</option>
            <option value="In Progress" ${task.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
            <option value="Completed" ${task.status === 'Completed' ? 'selected' : ''}>Completed</option>
            </select>
            `;
            
            const scoreText=row.insertCell(2)
            scoreText.textContent = task.score !== '-' ? `${task.score} / 100` : '-';
            
            if(task.score>=80){
                scoreText.style.color='green';
            }
            
            else if(task.score<50){
                scoreText.style.color='red';
            }
            
            else {
                if (task.score<80 && task.score>=50){
                    scoreText.style.color='orange';
                }
            }

            row.insertCell(3).textContent = task.feedback ? task.feedback : '-';
        });
    }
    
    function updateTaskStatus(taskId, newStatus) {

        const savedData = localStorage.getItem('interns');
        const interns = JSON.parse(savedData) || [];

        const currentEmail = localStorage.getItem('currentStudentEmail') || '';   
        const student = interns.find(i => i.email.toLowerCase() === currentEmail.toLowerCase());

        if (!student || !student.tasks) return;
        const task = student.tasks.find(t => t.id === taskId);

        if (task) {
            task.status = newStatus;
            localStorage.setItem('interns', JSON.stringify(interns));
            showToast(`Status updated to "${newStatus}"!`, 'success'); 
        }
    }

    function logout() {
        localStorage.removeItem('isStudent');
        localStorage.removeItem('currentStudentEmail');
        window.location.href = "login.html";
    }

    window.onload = loadStudentData;
</script>

</body>
</html>
