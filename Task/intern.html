<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>

    <link rel="stylesheet" href="toast.css">
    <script src="toast.js"></script>

    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
            box-sizing: border-box;
        }

        body {
            background-color: lightgray;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .wrapper {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        .container {
            height: 100%;
            padding: 30px; 
            background-color: #f8fafc; 
            border: 2px solid #e2e8f0; 
            border-radius: 5px;
        }

        .intern-profile {
            flex: 1;
            border-right: 2px solid #e2e8f0;
            background-color: white;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .intern-profile h1 {
            color: darkblue;
            margin: 0 0 5px 0;
            font-size: 30px;
        }

        .intern-profile h2 {
            color: darkblue;
            margin: 0 0 20px 0;
            font-size: 20px;
        }

        .info-card {
            background-color: white;
            border: 2px solid #e2e8f0;
            padding: 15px;
            margin-bottom: 12px;
        }

        .info-label {
            font-weight: bold;
            font-size: 15px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 15px;
            font-weight: bold;
            color: darkgreen;
        }

        .logout-btn {
            align-self: flex-start;
            background: red;
            color: white;
            font-weight: bold;
            margin-top: 20px;
            border: none;
            padding:5px 8px; 
            border-radius:3px;
            cursor:pointer;
        }

        .logout-btn:hover {
            background: #772020;      
            transition: all 0.5s ease;

        }

        .intern-task {
            flex: 2;
            background-color: white;
            border-radius: 5px;
            padding: 30px;
            display: flex;
            flex-direction: column;
        }

        .intern-task h1 {
            color: darkblue;
            margin: 0 0 15px 0;
            font-size: 28px;
        }

        .table-container {
            overflow-y: auto;
            flex: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border: 2px solid black;
            font-size: 15px;
        }

        th {
            background-color: gainsboro;
        }

    </style>
</head>
<body>
    <div class="wrapper">
        <div class="intern-profile">
            <div class="container">
                <h1>Student Dashboard</h1>
                <h2 id="welcomeText">Welcome!</h2>

                <div class="info-card">
                    <div class="info-label">Assigned Role</div>
                    <div class="info-value" id="roleValue">-</div>
                </div>

                <div class="info-card">
                    <div class="info-label">Assigned Manager</div>
                    <div class="info-value" id="managerValue">-</div>
                </div>

                <div class="info-card">
                    <div class="info-label">Average Performance</div>
                    <div class="info-value" id="avgRating">-</div>
                </div>
            </div>

            <button type="button" class="logout-btn" onclick="logout();">Logout</button>
        </div>

        <div class="intern-task">
            <h1>My Assigned Tasks & Scores</h1>

            <div class="table-container">
                <table id="performance-table">

                </table>
            </div>
        </div>
    </div>

    <script>

// =========================================================================
// 1. ROUTE GUARD
// =========================================================================

// 1. Read 'isStudent' from localStorage

const student=localStorage.getItem('isStudent');
if(!student){
    alert('Access Denied! Please log in first.');
    window.location.href='login.html'
}

// 2. If 'isStudent' is missing, alert 'Access Denied! Please log in first.' and redirect to 'login.html'




// =========================================================================
// 2. LOAD STUDENT DATA FUNCTION (PROFILE, AVERAGE & TASK TABLE)
// =========================================================================

// 3. Create function named 'loadStudentData'
function loadStudentData() {

    const interns=JSON.parse(localStorage.getItem('interns'))||[];
    const email=localStorage.getItem('currentStudentEmail')||'';

    const student=interns.find(intern=> intern.email.toLocaleLowerCase()===email.toLocaleLowerCase());

    // 4. Get and parse 'interns' array from localStorage (fallback to empty array [])


    // 5. Read 'currentStudentEmail' from localStorage (fallback to '')


    // 6. Find the student matching 'currentEmail' (case-insensitive)


    // 7. If student record not found, alert 'Student record not found!', call logout(), and return

    if(!student){
        alert('Student record not found!');
        logout();
        return;
    }




    document.getElementById('welcomeText').textContent=`Welcome ${student.name} !`;
    document.getElementById('roleValue').textContent=student.role;
    document.getElementById('managerValue').textContent=student.manager;




    // 8. Set 'welcomeText' to "Welcome, " + student.name + "!"


    // 9. Set 'roleValue' textContent to student.role


    // 10. Set 'managerValue' textContent to student.manager


    // 11. Extract student.tasks array (fallback to empty array [])

    const tasks=student.tasks||[];

    const gradedScores=[];

    tasks.forEach(task=>{
        if (task.score !=='-' && task.score !=='' && !isNaN(Number(task.score))){
            gradedScores.push(Number(task.score));
        }
    });


    // 12. Filter tasks with graded numeric scores (not '-', not '', and isNaN check), mapping them to numbers




    // 13. If there is at least one graded score:


    if (gradedScores.length!==0){
        const sum=gradedScores.reduce((sum,i)=>sum+i,0);
        const avg = (sum / gradedScores.length).toFixed(1);
        document.getElementById('avgRating').textContent=`${avg} / 100 (Task Completed : ${gradedScores.length} )`;
    }

    else{
        document.getElementById('avgRating').textContent='-';
    }


        // 14. Sum scores using reduce(), compute average to 1 decimal place, and set 'avgRating' textContent with total count
        


    // 15. Otherwise (no graded scores): set 'avgRating' textContent to '-'
    


    const table=document.getElementById('performance-table');
    table.innerHTML=`
    <tr>
        <th>Task Assigned</th>
        <th>Status</th>
        <th>Score</th>
        <th>Feedback</th>
    </tr>    
    `;

    // 16. Grab the table element with ID 'performance-table'


    // 17. Set table.innerHTML with 4 headers: Task Assigned, Status, Score, Feedback




    // 18. If tasks array has 0 items, insert a centered row spanning all 4 columns saying "No tasks assigned yet.", and return

    if (tasks.length===0){        
        table.insertRow().innerHTML=`<td colspan=4>No tasks assigned yet.</td>`;
        return;
    }

    // 19. Loop through each task to build table rows:

    tasks.forEach(task=>{
        const row=table.insertRow();

        row.insertCell(0).textContent=task.title;

        const statusCell=row.insertCell(1);
        
        statusCell.innerHTML=
        `<select onchange="updateTaskStatus(${task.id},this.value)" style="padding: 4px 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px;">
            <option value='Pending' ${task.status ==='Pending' ? 'selected' : ''}>Pending</option>
            <option value='In Progress' ${task.status ==='In Progress' ? 'selected' : ''}>In Progress</option>
            <option value='Completed' ${task.status ==='Completed' ? 'selected' : ''}>Completed</option>    
        </select>`;


        const scoreCell=row.insertCell(2);
        
        scoreCell.textContent= (task.score!=='-') ? `${task.score}/100` : '-';

        if (task.score>=80){
            scoreCell.style.color='green';
        }
        else if(task.score<80 && task.score>=50){
            scoreCell.style.color='orange';            
        }
        else {
            if (task.score<50){
                scoreCell.style.color='red';
            }
        }

        const feedbackCell=row.insertCell(3);
        feedbackCell.textContent=task.feedback ? task.feedback : '-';

    });

        // 20. Insert a new row (table.insertRow())

        // 21. Cell 0: set textContent to task.title

        // 22. Cell 1: set innerHTML to a status dropdown calling updateTaskStatus with task.id and this.value, pre-selecting the current status using ternary checks

        // 23. Cell 2: set textContent to task.score + " / 100" (or '-' if ungraded)

        // 24. If score is >= 80, color green; if < 50, color red; otherwise if between 50 and 79, color orange


       

        // 25. Cell 3: set textContent to task.feedback (or '-' if empty)
        

}


// =========================================================================
// 3. UPDATE TASK STATUS FUNCTION
// =========================================================================

// 26. Create function 'updateTaskStatus' taking 'taskId' and 'newStatus'
function updateTaskStatus(taskId, newStatus) {

    // 27. Get and parse 'interns' array from localStorage

    const interns=JSON.parse(localStorage.getItem('interns'))||[]; 
    const email=localStorage.getItem('currentStudentEmail')||'';


    // 28. Read 'currentStudentEmail' from localStorage (fallback to '')


    // 29. Find the student matching 'currentEmail' (case-insensitive)

    const student=interns.find(intern=> intern.email.toLocaleLowerCase()===email.toLocaleLowerCase());

    if (!student || !student.tasks){
        return;
    }

    const task=student.tasks.find(task=> task.id===taskId);

    // 30. If student or student.tasks is missing, return early


    // 31. Find the task matching 'taskId' inside student.tasks


    // 32. If task exists:
    if (task){
        task.status=newStatus;
        localStorage.setItem('interns', JSON.stringify(interns));
        showToast(`Status updated to "${newStatus}"!`);

    }

       
    else {
        showToast("Task not found or already deleted!", "error");   
    }




        // 33. Set task.status = newStatus


        // 34. Save updated interns array to localStorage as a JSON string


        // 35. Show success toast: `Status updated to "${newStatus}"!`
        

}


// =========================================================================
// 4. LOGOUT & INITIAL LOAD
// =========================================================================

// 36. Create function named 'logout'
function logout() {

    localStorage.removeItem('isStudent');
    localStorage.removeItem('currentStudentEmail');
    window.location.href='login.html';

    // 37. Remove 'isStudent' from localStorage


    // 38. Remove 'currentStudentEmail' from localStorage


    // 39. Redirect to 'login.html'

}

// 40. Run loadStudentData when the window loads
window.onload=loadStudentData;
</script>

</body>
</html>
