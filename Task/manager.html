<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard</title>
    
    <link rel="stylesheet" href="toast.css">
    <script src="toast.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: lightgray;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .wrapper {
            display: flex; 
            width: 95%;  
            height: 90vh;
            gap: 25px;
        }

        .manager-form-panel {
            flex: 1;
            background-color: white;
            padding: 30px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .manager-form-panel h1 {
            color: darkblue;   
            margin: 0 0 5px 0;
            font-size: 30px;
        }

        .manager-form-panel h2 {
            color: darkblue;
            margin: 0 0 10px 0;
            font-size: 20px;
        }

        .manager-form-panel h3 {
            color: darkgreen;
            margin: 0 0 10px 0;
            font-size: 18px;
        }

        .manager-form-panel label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            font-size: 15px;
        }

        .manager-form-panel input,
        .manager-form-panel select {
            width: 100%;
            padding: 10px;
            margin: 6px 0 6px 0;
            border-radius: 5px;
            border: 2px solid #e2e8f0;
        }

        .form-container {
            height: 100%;
            padding: 30px; 
            background-color: #f8fafc; 
            border: 2px solid #e2e8f0; 
            border-radius: 5px;
        }

        .add-btn {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .add-btn:hover {
            background-color: #0056b3;
        }

        .logout-btn {
            align-self: flex-start;
            background: red;
            color: white;
            font-weight: bold;
            margin-top: 20px;
            border: none;
            padding:5px 8px; 
            border-radius:3px;
            cursor:pointer;
        }

        .logout-btn:hover {
            background: #c74040;        
        }

        .manager-table-panel {
            flex: 2;
            padding: 30px;
            background-color: white;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
        }

        .manager-table-panel h1 {
            color: darkblue;
            margin: 0 0 15px 0;
        }

        .table-container {
            overflow-y: auto;
            flex: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border: 2px solid black;
            font-size: 15px;
        }

        th {
            background-color: gainsboro;
        }
        
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="manager-form-panel"> 
            <div class="form-container">
                <h1>Manager Dashboard</h1>
                <h2 id="welcomeText">Welcome, Manager!</h2>

                <div style="background-color: white; border: 2px solid #e2e8f0; border-radius: 6px; padding: 10px; margin-bottom: 10px;">
                    <span style="font-size: 14px; font-weight: bold; color: #49586c;">Assigned Interns:</span>
                    <span id="assignedCount" style="font-size: 14px; font-weight: bold; color: #1e3a8a; margin-left: 6px;">0</span>
                </div>

                <h3>Assign Task</h3>
                <form id="taskForm" onsubmit="event.preventDefault(); assignTask();">
    
                    <label for="selectIntern">Select Intern:</label>
                    <select id="selectIntern" required></select>
    
                    <label for="taskTitle">Task Assigned:</label>
                    <textarea id="taskTitle" placeholder="e.g., Intern Management System" style="width: 400px; height: 180px; padding: 5px; margin-top:10px;" required></textarea>

                    <button type="submit" class="add-btn">Assign Task</button>

                </form>
            </div>
            
            <button type="button" class="logout-btn" onclick="logout();">Logout</button>
        </div>

        <div class="manager-table-panel">
            <h1>My Assigned Interns</h1>
                      
            <div style="margin-bottom: 12px;">
                <input type="text" id="tableSearch" placeholder="Search by name, email, or task" onkeyup="filterTable()"
                style="width: 100%; padding: 8px 12px; border: 1px solid grey; border-radius: 4px; font-size: 14px;">
            </div>
            
            <div class="table-container">
                <table id="intern-table">

                </table> 
            </div>
        </div>
    </div>

    <script>

    const myManagerName = localStorage.getItem('currentManager');
    if (!myManagerName) {
        alert("Access Denied! Please log in first.");
        window.location.href = "login.html"; 
    }
    document.getElementById('welcomeText').textContent = "Welcome, " + myManagerName + "!";

    function loadData() {
        const savedData = localStorage.getItem('interns');
        const interns = JSON.parse(savedData) || [];

        const select = document.getElementById('selectIntern');
        select.innerHTML = '<option value="">-- Select Intern --</option>';

        const assignedInterns = interns.filter(i => i.manager === myManagerName);
        
        document.getElementById('assignedCount').textContent = assignedInterns.length;
        
        assignedInterns.forEach(intern => {
            const opt = document.createElement('option');
            opt.value = intern.email;
            opt.textContent = `${intern.name} (${intern.role})`;
            select.appendChild(opt);
        });

        const table = document.getElementById('intern-table');
        table.innerHTML = `
            <tr>
                <th>Intern</th>
                <th>Task Assigned</th>
                <th>Status</th>
                <th>Score</th>
                <th>Feedback</th>
                <th>Action</th>
            </tr>
        `;

        let hasTasks = false;
        assignedInterns.forEach(intern => {
            (intern.tasks || []).forEach(task => {
                hasTasks = true;
                const row = table.insertRow();
                row.insertCell(0).textContent = intern.name;

                const taskCell = row.insertCell(1);
                taskCell.innerHTML = `
                <textarea id="task_title_${task.id}" style="width: 100%; height: 100px; font-family: Arial, sans-serif; font-size: 13px; padding: 5px; resize: vertical;">${task.title}</textarea>
                <small style="color: grey; display: block; margin-top: 5px;">Assigned: ${task.assignedDate || 'N/A'}</small>
                `;

                const statusCell = row.insertCell(2);
                statusCell.innerHTML = `
                <select onchange="updateStatus('${intern.email}', ${task.id}, this.value)" style="padding: 4px; font-size: 13px;">
                    <option value="Pending" ${task.status === 'Pending' ? 'selected' : ''}>Pending</option>
                    <option value="In Progress" ${task.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                    <option value="Completed" ${task.status === 'Completed' ? 'selected' : ''}>Completed</option>
                    </select>
                    `;
                    
                const scoreCell = row.insertCell(3);
                
                scoreCell.innerHTML = `
                <input type="number" id="score_${task.id}" min="0" max="100" style="width: 44px; padding: 3px; text-align: center;" placeholder="0" value="${task.score !== '-' ? task.score : ''}">
                <span style="font-size: 12px; font-weight: bold;">/ 100</span>
                `;
                
                const feedbackCell = row.insertCell(4);
                
                feedbackCell.innerHTML = `
                <textarea id="fb_${task.id}" style="width: 100%; height: 100px; font-family: Arial, sans-serif; font-size: 13px; padding: 5px; resize: vertical;" placeholder="Add feedback...">${task.feedback ? task.feedback : ''}</textarea>                
                `;
        
                const actionCell = row.insertCell(5);
        
                actionCell.innerHTML = `
                <button style="background:green; color:white; border:none; padding:5px 8px; border-radius:3px; cursor:pointer;" onclick="saveScoreAndFeedback('${intern.email}', ${task.id})">Save</button>
                <button type="button" style="background:red; color:white; border:none; padding:5px 8px; border-radius:3px; cursor:pointer; margin-top:4px;" onclick="deleteTask('${intern.email}', ${task.id})">Delete</button>
                `;

            });
        });

        if (!hasTasks) {
            table.insertRow().innerHTML = `<td colspan="6" style="text-align:center; padding: 20px;">No tasks assigned yet.</td>`;
        }
    }

    function assignTask() {

        const email = document.getElementById('selectIntern').value;
        const title = document.getElementById('taskTitle').value.trim();

        const savedData = localStorage.getItem('interns');
        const interns = JSON.parse(savedData) || [];
        const intern = interns.find(i => i.email.toLowerCase() === email.toLowerCase());

        if (!intern) return;
        if (!intern.tasks) intern.tasks = [];

        const todayDate = new Date().toLocaleDateString('en-GB'); 

        intern.tasks.push({
            id: Date.now(),
            title: title,
            assignedDate: todayDate,
            status: 'Pending',
            score: '-'
        });

        localStorage.setItem('interns', JSON.stringify(interns));
        document.getElementById('taskForm').reset();
        loadData();
    }

    function saveScoreAndFeedback(email, taskId) {

        const val = document.getElementById(`score_${taskId}`).value.trim();
        if (val === '' || isNaN(Number(val)) || Number(val) < 0 || Number(val) > 100) {
            showToast("Please enter a score between 0 and 100.", "error");
            return;
        }

        const feedbackVal = document.getElementById(`fb_${taskId}`).value.trim();
        const titleElem = document.getElementById(`task_title_${taskId}`);   
        const titleVal = titleElem ? titleElem.value.trim() : '';

        const savedData = localStorage.getItem('interns');
        const interns = JSON.parse(savedData) || [];

        const intern = interns.find(i => i.email.toLowerCase() === email.toLowerCase());
        const task = (intern && intern.tasks) ? intern.tasks.find(t => t.id === taskId) : null;

        if (task) {
            task.title = titleVal;
            task.score = Number(val);
            task.feedback = feedbackVal;

            localStorage.setItem('interns', JSON.stringify(interns));
            showToast(`Score saved: ${val} points.`, 'success');
            loadData();
        }
    }

    function updateStatus(email, taskId, newStatus) {

        const savedData = localStorage.getItem('interns');
        const interns = JSON.parse(savedData) || [];
        const intern = interns.find(i => i.email.toLowerCase() === email.toLowerCase());

        const task = (intern.tasks || []).find(t => t.id === taskId);
        if (task) {
            task.status = newStatus;
            localStorage.setItem('interns', JSON.stringify(interns));
            showToast(`Status updated to ${newStatus}.`, 'success');
        }
    }

    function deleteTask(email, taskId) {
        if (!confirm("Are you sure you want to delete this task?")) {
            return;
        }
        const savedData = localStorage.getItem('interns');
        const interns = JSON.parse(savedData) || [];  
        const intern = interns.find(i => i.email.toLowerCase() === email.toLowerCase());

        if (!intern || !intern.tasks) return;
        intern.tasks = intern.tasks.filter(t => t.id !== taskId);
        localStorage.setItem('interns', JSON.stringify(interns));
        loadData(); 
    }

    function filterTable() {
        const input = document.getElementById("tableSearch");
        const filter = input.value.toLowerCase();

        const table = document.querySelector(".table-container table");
        const rows = table.getElementsByTagName("tr");
        
        for (let i = 1; i < rows.length; i++) {
                const rowText = rows[i].textContent.toLowerCase();
                if (rowText.includes(filter)) {    
                    rows[i].style.display = "";

                } else {
                    rows[i].style.display = "none";
                }
            }
        }

        function logout() {
            localStorage.removeItem('currentManager'); 
            window.location.href = "login.html";      
        }        
        window.onload = loadData;

</script>

</body>
</html>
