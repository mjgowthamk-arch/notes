<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard</title>
    
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: lightgray;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .wrapper {
            display: flex; 
            width: 95%;  
            height: 90vh;
            gap: 25px;
        }

        .manager-form-panel {
            flex: 1;
            background-color: white;
            padding: 30px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .manager-form-panel h1 {
            color: darkblue;   
            margin: 0 0 5px 0;
            font-size: 24px;
        }

        .manager-form-panel h2 {
            color: darkblue;
            margin: 0 0 20px 0;
            font-size: 18px;
        }

        .manager-form-panel h3 {
            color: darkgreen;
            margin: 0 0 15px 0;
            font-size: 18px;
        }

        .manager-form-panel label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            font-size: 15px;
        }

        .manager-form-panel input,
        .manager-form-panel select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 12px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .add-btn {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .add-btn:hover {
            background-color: #0056b3;
        }

        .logout-link {
            color: red;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
            display: inline-block;
        }

        .manager-table-panel {
            flex: 2;
            padding: 30px;
            background-color: white;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
        }

        .manager-table-panel h1 {
            color: darkblue;
            margin: 0 0 15px 0;
        }

        .table-container {
            overflow-y: auto;
            flex: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border: 2px solid black;
            font-size: 15px;
        }

        th {
            background-color: #f1f5f9;
        }
    </style>

</head>
<body>
    <div class="wrapper">
        <div class="manager-form-panel"> 
            <div>
                <h1>Manager Dashboard</h1>
                <h2 id="welcomeText">Welcome, Manager!</h2>

                <h3>Assign Weekly Performance</h3>

                <form id="internForm" onsubmit="event.preventDefault(); addPoints();">
                    <label for="selectIntern">Select Intern:</label>
                    <select id="selectIntern" required>
                        
                    </select>

                    <label for="week">Weekly performance:</label>
                    <select id="week" required>
                        <option value="">-- Select week --</option>
                        <option value="week1">Week 1</option>
                        <option value="week2">Week 2</option>
                        <option value="week3">Week 3</option>
                        <option value="week4">Week 4</option>
                    </select>

                    <label for="points">Score Points (0 - 100):</label>
                    <input type="number" id="points" placeholder="e.g., 85" min="0" max="100" required>

                    <button type="submit" class="add-btn">Submit Score</button>
                </form>
            </div>

            <a href="#" onclick="logout();" class="logout-link">Logout</a>
        </div>

        <div class="manager-table-panel">
            <h1>My Assigned Interns</h1>
            <div class="table-container">
                <table id="intern-table">

                </table> 
            </div>
        </div>
    </div>

    <script>

    const myManagerName = localStorage.getItem('currentManager');

    if (!myManagerName) {
        alert("Access Denied! Please log in first.");
        window.location.href = "login.html"; 
    }

    document.getElementById('welcomeText').textContent = "Welcome, " + myManagerName + "!";

    function loadData() {

        const savedData = localStorage.getItem('interns');
        const interns = JSON.parse(savedData) || [];

        const select = document.getElementById('selectIntern');

        select.innerHTML='<option value="">-- Select Intern --</option>';

        for (let i = 0; i < interns.length; i++) {

            if (interns[i].manager === myManagerName) {
                const option = document.createElement('option');
                option.value = interns[i].name;
                option.textContent = interns[i].name + " (" + interns[i].role + ")";
                select.append(option);
            }
        }

        const table = document.getElementById('intern-table');
        table.innerHTML = `
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Week 1</th>
                <th>Week 2</th>
                <th>Week 3</th> 
                <th>Week 4</th>
            </tr>
        `;

        for (let i = 0; i < interns.length; i++) {

            if (interns[i].manager === myManagerName) {
                const row = table.insertRow();
                row.insertCell(0).textContent = interns[i].name;
                row.insertCell(1).textContent = interns[i].role;
                row.insertCell(2).textContent = interns[i].week1;
                row.insertCell(3).textContent = interns[i].week2;
                row.insertCell(4).textContent = interns[i].week3;
                row.insertCell(5).textContent = interns[i].week4;
            }
        }
    }

    function addPoints() {
        const selectedName = document.getElementById('selectIntern').value;
        const selectedWeek = document.getElementById('week').value;
        const points = document.getElementById('points').value;

        const savedData = localStorage.getItem('interns');
        const interns = JSON.parse(savedData) || [];

        for (let i = 0; i < interns.length; i++) {
            if (interns[i].name === selectedName) {
                interns[i][selectedWeek] = points; 
                break;
            }
        }

        localStorage.setItem('interns', JSON.stringify(interns));

        alert(points + " points assigned for " + selectedName + " (" + selectedWeek + ")");

        document.getElementById('internForm').reset();
        loadData();
    }

    function logout() {
        localStorage.removeItem('currentManager'); 
        window.location.href = "login.html";       
    }

    window.onload = loadData;
</script>

</body>
</html>
