<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/login.png" type="image/png">
    <title>Login - KTT IMS</title>
    <style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: whitesmoke;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    
    .login-image img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;        
    }

    .wrapper {
        display: flex; 
        width: 900px;
        height: 600px;
        border-radius: 8px;
        overflow: hidden;
    }
    
    .login-image {
        flex: 1;    
    }

    .login-form {
        flex: 1;     
        background-color: #334155;
        color: white;
        padding: 40px 50px;
        display: flex;
        flex-direction: column;
        justify-content: center;    
    }

    .login-form h1 {
        text-align: center;
        margin: 0 0 10px 0;
        font-size: 30px;    
    }

    .login-form h2 {
        text-align: center;
        margin: 0 0 25px 0;
        font-size: 20px;
        font-weight: normal;
        color: #cbd5e1;    
    }

    .login-form label {
        display: block;
        font-size: 15px;
        margin-top: 10px;    
    }

    .login-form input,
    .login-form select {
        width: 100%;
        padding: 10px;
        margin-top: 6px;    
        margin-bottom: 12px;
        border-radius: 5px;
        border: 1px solid #ccc;        
    }

    .login-btn {
        width: 100%;
        padding: 12px;
        margin-top: 20px;
        background-color: blue;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 15px;
        font-weight: bold;
    }

    .login-btn:hover {
        background-color: #0056b3;
        transition: all 0.5s ease;
    }    
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="login-image">
            <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=900&q=80" alt="Team Work">
        </div>

        <div class="login-form">

            <h1>KT Telematics Solutions</h1>
            <h2>Intern Management Portal</h2>

            <form id="loginForm" onsubmit="event.preventDefault(); login();">

                <label for="username">Username:</label>
                <input type="text" id="username" name="username" placeholder="admin / manager / student@gmail.com" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="123" required>

                <label for="role">Role:</label>
                <select id="role" name="role" required>
                    
                    <option value="">Select Role</option>
                    <option value="admin">HR Admin</option>
                    <option value="Manager 1">Manager 1</option>
                    <option value="Manager 2">Manager 2</option>
                    <option value="Intern">Intern</option>
               
                </select>
            
                <button type="submit" class="login-btn">Login</button>
            </form>
        </div>
    </div>
    
    <script>
    // 1. Create a function named 'login'
    function login() {

        const username=document.getElementById('username').value;

        // 2. Grab the text from the 'username' input box and store it in 'user'

        const password=document.getElementById('password').value;

        // 3. Grab the text from the 'password' input box and store it in 'password'

        const role=document.getElementById('role').value;

        // 4. Grab the selected option from the 'role' dropdown and store it in 'role'

        if (username.toLowerCase() == 'admin' && password == '123' && role == 'admin'){
            localStorage.setItem('isAdmin', 'true');
            window.location.href='admin.html';
        }

        // 5. Check if user is 'admin' (case-insensitive), password is '123', and role is 'admin'
    
        // 6. Save 'isAdmin' as 'true' in localStorage
                
        // 7. Redirect the browser to 'admin.html'

        else if(username.toLowerCase() == 'manager'&& password == '123' && (role=='Manager 1' || role=='Manager 2')){
            localStorage.setItem('currentManager', role);
            window.location.href='manager.html';
        }

        // 8. Otherwise, check if user is 'manager', password is '123', and role is EITHER 'Manager 1' OR 'Manager 2'

        // 9. Save the selected role as 'currentManager' in localStorage
        
        // 10. Redirect the browser to 'manager.html'

        else if (password=='123' && role=='Intern'){
            const data = JSON.parse(localStorage.getItem('interns')) || [];
            const user=data.find(i=> i.email.toLowerCase()===username.toLowerCase());

            if (user){
                localStorage.setItem('isStudent', 'true');
                localStorage.setItem('currentStudentEmail', user.email);
           
                window.location.href='intern.html'
            }

            else {
                alert('No intern found with this email address. Please check and try again.');
            }       
        }

        else {
            alert('Invalid. Please try again');
        }

        // 11. Otherwise, check if password is '123' and role is 'Intern'
    
        // 12. Read and parse the 'interns' array from localStorage (or fallback to empty array [])
        
        // 13. Search the interns array to find one whose email matches the username (case-insensitive)
        
        // 14. If a matching intern was found:
        
        // 15. Save 'isStudent' as 'true' in localStorage
            
        // 16. Save the intern's email as 'currentStudentEmail' in localStorage
            
        // 17. Redirect the browser to 'intern.html'
            
        // 18. If no matching intern was found:
        
        // 19. Show an alert: 'No intern found with this email address. Please check and try again.'
            
        // 20. If none of the roles or credentials matched:
    
        // 21. Show an alert: 'Invalid. Please try again'   
    }
    </script>
</body>
</html>
