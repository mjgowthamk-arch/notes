<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/login.png">

    <title>Login Form</title>
    
</head>

<body>
    <div class="cont1">
        <img src="/images/login.png" class="logo" alt="Login Portal Logo">
    </div>

    <form id="loginForm">

        <div class="cont2">

            <label for="email">Email:</label>
            <input type="email" name="email" id="email" placeholder="Enter your email" autocomplete="email" required>
            <br><br>

            <label for="pass">Password:</label>
            <input type="password" name="password" id="pass" minlength="3" placeholder="Enter your password" autocomplete="current-password" required>
            <br><br>

            <label for="chbox">Remember me</label>
            <input type="checkbox" name="remember" id="chbox" value="remember-me">
            <br><br>
            
            <input type="submit" value="Log In">

        </div>

    </form>
    
</body>
</html>
