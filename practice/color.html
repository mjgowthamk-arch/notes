<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color</title>
    <style>

    </style>
</head>
<body>
    <button onclick="dark()">Darkmode</button>
    <div id="cont" style="background-color:brown;width:200px; height:150px; border: 6px solid black; margin-top: 20px;"></div>

    <script>
        function dark(){
            console.log(event.target);
            if (document.body.style.backgroundColor==''){
                document.body.style.backgroundColor='gray';
            }
            else{
                document.body.style.backgroundColor=''            
            }
        }

        const box=document.getElementById('cont');
        const ogcolor=window.getComputedStyle(box).backgroundColor;

        box.onclick=function(){
            let arr=['violet','indigo','blue','green','yellow','orange','red'];
            let i=0;
            let timer= setInterval(()=>{
                box.style.backgroundColor=arr[i];
                i++;
                if (i>=arr.length){
                    i=0;
                }
            }, 100);

            setTimeout(()=>{
                clearInterval(timer);
                box.style.backgroundColor=ogcolor;      
            }, 3000)
        };

    </script>
    
</body>
</html>
