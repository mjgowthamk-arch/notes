$kind: http-request
method: GET
url: 'http://localhost:3000/api/interns'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
            "name": "{{randomName}}",
            "role": "FullStack"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const randomNum = Math.floor(Math.random() * 1000);
      pm.environment.set("randomName", "Intern_" + randomNum);
      
      const randomId = Math.floor(Math.random() * 5) + 1;
      pm.variables.set("randomId", randomId);
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      
      pm.test("Response body is an array", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.be.an('array');
      });
      
      pm.test("Response contains expected fields", function () {
          var jsonData = pm.response.json();
          if (jsonData.length > 0) {
              pm.expect(jsonData[0]).to.have.property('id');
              pm.expect(jsonData[0]).to.have.property('name');
              pm.expect(jsonData[0]).to.have.property('role');
          }
      });
